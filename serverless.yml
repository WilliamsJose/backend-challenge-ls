org: willjs
app: backend-challenge-ls
service: backend-challenge-ls

plugins:
  - serverless-offline

provider:
  name: aws
  runtime: nodejs22.x
  region: us-east-1
  stage: prod
  profile: awsDevelopment

functions:
  findAllSchedules:
    handler: src/agenda/find-all-schedules.handler
    description: 'Retorna todas as agendas e horários disponíveis'
    events:
      - http:
          path: agendas
          method: get

  postSchedule:
    handler: src/agendamento/post-schedule.handler
    description: 'Cria um novo agendamento'
    events:
      - http:
          path: agendamento
          method: post
    # destinations:
