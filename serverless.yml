service: backend-challenge

plugins:
  - serverless-offline

provider:
  name: aws
  runtime: nodejs22.x

functions:
  findAllSchedules:
    handler: src/agenda/find-all-schedules.handler
    description: 'Retorna todas as agendas e horários disponíveis'
    events:
      - http:
          path: agendas
          method: get

  postSchedule:
    handler: src/agendamento/post-schedule.handler
    description: 'Cria um novo agendamento'
    events:
      - http:
          path: agendamento
          method: post
    # destinations:
